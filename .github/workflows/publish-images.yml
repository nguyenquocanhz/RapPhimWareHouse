# Dung anh Docker roi day len GitHub Container Registry.
#
# Khong can khai bao khoa nao: GITHUB_TOKEN duoc GitHub cap san cho moi lan chay,
# chi can xin quyen ghi package o duoi.
name: Xuất bản ảnh Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      # Mot anh hong thi van day not anh kia, de con biet cai nao that su hong.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: web
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Đặt nhãn cho ảnh
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rapphim-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build và đẩy lên
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dung lai lop da build o lan truoc, do phai cho Maven va npm tai lai tu dau.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
