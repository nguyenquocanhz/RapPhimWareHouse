# RapPhim WareHouse - chay ca hai tang bang Docker.
#
# Cong 8080 tren homelab da co ZCloud dung roi, nen backend duoc dua ra ngoai o 7101,
# web o 7100. Ben trong mang cua Docker chung van nghe 8080 va 3000 nhu binh thuong.
#
#   docker compose up -d --build
#
# Cac gia tri thay doi theo may dat trong tep .env dat canh tep nay (xem .env.example).

services:
  # Bo phan giai ten mien rieng, xem Corefile de biet vi sao can.
  dns:
    image: coredns/coredns:1.14.7
    container_name: rapphim-dns
    restart: unless-stopped
    command: ["-conf", "/Corefile"]
    volumes:
      - ./Corefile:/Corefile:ro
    networks:
      rapphim:
        ipv4_address: 172.29.0.53

  backend:
    build:
      context: ./backend
    image: rapphim-backend:latest
    container_name: rapphim-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-7101}:8080"
    environment:
      # Dia chi cua frontend nhin tu trinh duyet - thieu cai nay thi trinh duyet chan
      # moi loi goi API vi khac goc.
      RAPPHIM_CORS_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:7100}

      # Kho phim rieng. De trong thi nguon homelab tu tat, phan con lai van chay.
      ZCLOUD_API_KEY: ${ZCLOUD_API_KEY:-}
      ZCLOUD_PASSWORD: ${ZCLOUD_PASSWORD:-}
      ZCLOUD_PREFIX: ${ZCLOUD_PREFIX:-}
      # Tu trong container, "localhost" la chinh container do - phai goi qua dia chi
      # cua may chu.
      RAPPHIM_ZCLOUD_BASE_URL: ${ZCLOUD_BASE_URL:-http://host.docker.internal:8080}

      # Metadata cho file NFO. Thieu thi cac endpoint TMDB tra 503, phan con lai chay.
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # De trong thi goi thang TMDB. ISP chan thi tro qua Cloudflare Worker proxy
      # (xem tmdb-proxy/README.md): dat TMDB_BASE_URL=.../3 va TMDB_IMAGE_BASE_URL=.../t/p
      TMDB_BASE_URL: ${TMDB_BASE_URL:-}
      TMDB_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL:-}

      # Trang quan tri: de trong thi chi xem duoc, khong sua duoc nguon.
      RAPPHIM_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RAPPHIM_SOURCES_FILE: /app/data/custom-sources.json
    volumes:
      # Nguon tu them phai song qua lan dung lai container, neu khong thi dung lai
      # anh moi la mat sach.
      - rapphim-data:/app/data
    # Dung bo phan giai rieng o tren. Phai ghi bang dia chi IP: Docker khong nhan ten
    # dich vu o muc nay.
    dns:
      - 172.29.0.53
    depends_on:
      - dns
    extra_hosts:
      # Cho phep goi nguoc ve dich vu dang chay tren chinh may chu (ZCloud).
      - "host.docker.internal:host-gateway"
    networks:
      - rapphim

  web:
    build:
      context: ./frontend
    image: rapphim-web:latest
    container_name: rapphim-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-7100}:3000"
    environment:
      # Dia chi duy nhat ma frontend can. Trinh duyet khong dung toi no: moi loi goi
      # deu di qua route handler cua chinh ung dung Next.
      API_INTERNAL_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - rapphim

  # Dich vu thuyet minh (dub) da tat: ML nang (PaddleOCR ONNX + ffmpeg + TTS) qua suc
  # homelab hien tai. Ma nguon van con o thu muc dub/ va tang giao dien; muon bat lai:
  # them lai service nay + dat DUB_INTERNAL_URL cho web + bat co NEXT_PUBLIC_DUB_ENABLED.

volumes:
  rapphim-data:

networks:
  rapphim:
    driver: bridge
    # Dat dai co dinh de gan duoc dia chi tinh cho bo phan giai. Cac dai 172.17 den
    # 172.23 tren may nay da co du an khac dung.
    ipam:
      config:
        - subnet: 172.29.0.0/16
