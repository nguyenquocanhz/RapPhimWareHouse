server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json
  error:
    include-message: always

spring:
  application:
    name: rapphim-warehouse
  jackson:
    default-property-inclusion: non_null

rapphim:
  cors:
    # Chay bang Docker thi frontend khong con o localhost:3000 nua, nen dia chi duoc
    # phep phai doi duoc tu ben ngoai.
    allowed-origins: ${RAPPHIM_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  provider:
    connect-timeout: 5s
    read-timeout: 20s
    kkphim:
      base-url: https://phimapi.com
      cdn-image: https://phimimg.com
    nguonc:
      base-url: https://phim.nguonc.com
      cdn-image: ""

  # TheMovieDB: nguon metadata de sinh file NFO cho Kodi / Jellyfin / Emby.
  # Khong dat khoa truc tiep o day. Dat bien moi truong truoc khi chay:
  #   TMDB_ACCESS_TOKEN  token doc v4  (uu tien)
  #   TMDB_API_KEY       khoa API v3
  # Thieu ca hai thi cac endpoint TMDB tra 503 TMDB_NOT_CONFIGURED,
  # rieng endpoint xuat NFO van chay bang du lieu cua nguon phim.
  tmdb:
    base-url: https://api.themoviedb.org/3
    image-base-url: https://image.tmdb.org/t/p
    language: vi-VN
    access-token: ${TMDB_ACCESS_TOKEN:}
    api-key: ${TMDB_API_KEY:}

  # AniList: nguon metadata anime (GraphQL, hop phap, khong phat video).
  # Khong can khoa - de trong la chay. Chi doi base-url neu can proxy.
  anilist:
    base-url: https://graphql.anilist.co

  # Kho phim rieng tren homelab (ZCloud - FastAPI + S3).
  # Khong dat khoa truc tiep o day. Dat bien moi truong truoc khi chay:
  #   ZCLOUD_API_KEY   khoa goi thang, gui qua header x-api-key  (uu tien)
  #   ZCLOUD_PASSWORD  mat khau dang nhap, dung khi chua tao khoa
  # Thieu ca hai thi nguon homelab tra ve rong, phan con lai cua API van chay.
  zcloud:
    base-url: http://192.168.100.169:8080
    api-key: ${ZCLOUD_API_KEY:}
    password: ${ZCLOUD_PASSWORD:}
    # Thu muc goc chua phim trong kho. De rong nghia la quet ca kho.
    prefix: ${ZCLOUD_PREFIX:}
    presign-expiry: 6h
    page-size: 1000

  # Trang quan tri: them nguon phim luc dang chay.
  # Khong dat khoa o day. Dat bien moi truong RAPPHIM_ADMIN_TOKEN truoc khi chay;
  # thieu khoa thi phan sua doi tu tat, trang quan tri chi con xem duoc.
  admin:
    token: ${RAPPHIM_ADMIN_TOKEN:}
    sources-file: ${RAPPHIM_SOURCES_FILE:data/custom-sources.json}
    connect-timeout: 5s
    read-timeout: 20s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.rapphim.warehouse: INFO
