# Chay RapPhim bang anh da dung san - khong can ma nguon, khong phai build.
#
#   curl -O https://raw.githubusercontent.com/nguyenquocanhz/RapPhimWareHouse/main/docker-compose.prod.yml
#   curl -o .env https://raw.githubusercontent.com/nguyenquocanhz/RapPhimWareHouse/main/.env.example
#   docker compose -f docker-compose.prod.yml up -d
#
# Anh khong nhung dia chi nao ben trong nen chay duoc o bat ky may nao; doi cong thi
# sua WEB_PORT / BACKEND_PORT trong .env la du.

services:
  # Bo phan giai ten mien rieng, xem Corefile de biet vi sao can.
  dns:
    image: coredns/coredns:1.14.7
    container_name: rapphim-dns
    restart: unless-stopped
    # CoreDNS do that ~11 MiB; 64m la thua thai an toan.
    mem_limit: 64m
    command: ["-conf", "/Corefile"]
    volumes:
      - ./Corefile:/Corefile:ro
    networks:
      rapphim:
        ipv4_address: 172.29.0.53

  backend:
    image: ghcr.io/nguyenquocanhz/rapphim-backend:${TAG:-latest}
    container_name: rapphim-backend
    restart: unless-stopped
    # Chan RAM cua backend. Hai ly do:
    #   1. Anh dat MaxRAMPercentage=75 - khong co mem_limit thi JVM doc RAM CA HOST
    #      va tu cho phep heap qua lon so voi may. Ghim -Xmx ben duoi cho tran ro.
    #   2. Khoanh vung su co: khong gioi han thi khi tien trinh phinh, OOM-killer cua
    #      kernel chon nan nhan TOAN MAY - co the ban nham sshd, mat luon SSH. Co
    #      mem_limit thi Docker chi giet rieng container nay, va no tu restart.
    # Tri mac dinh hop VPS 2GB (muc "on ap"). Tren 1GB, dat trong .env:
    #   BACKEND_MEM_LIMIT=640m  va  JAVA_OPTS=-Xmx384m
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    ports:
      - "${BACKEND_PORT:-7101}:8080"
    environment:
      # Tran heap JVM. Do that: heap dung ~161MB, cache Caffeine co chan cung
      # (maximumSize 500/1000/32/4) nen heap co tran that - 640m la du rong.
      JAVA_OPTS: ${JAVA_OPTS:--Xmx640m}

      # Chi can khi co nguoi goi thang API tu trinh duyet. Ban than trang web khong
      # can, vi moi loi goi cua no deu di qua may chu Next.
      RAPPHIM_CORS_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:7100}

      ZCLOUD_API_KEY: ${ZCLOUD_API_KEY:-}
      ZCLOUD_PASSWORD: ${ZCLOUD_PASSWORD:-}
      ZCLOUD_PREFIX: ${ZCLOUD_PREFIX:-}
      RAPPHIM_ZCLOUD_BASE_URL: ${ZCLOUD_BASE_URL:-http://host.docker.internal:8080}

      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}

      # Trang quan tri: de trong thi chi xem duoc, khong sua duoc nguon.
      RAPPHIM_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RAPPHIM_SOURCES_FILE: /app/data/custom-sources.json
    volumes:
      # Nguon tu them phai song qua lan dung lai container, neu khong thi dung lai
      # anh moi la mat sach.
      - rapphim-data:/app/data
    # Dung bo phan giai rieng o tren. Phai ghi bang dia chi IP: Docker khong nhan ten
    # dich vu o muc nay.
    dns:
      - 172.29.0.53
    depends_on:
      - dns
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rapphim

  web:
    image: ghcr.io/nguyenquocanhz/rapphim-web:${TAG:-latest}
    container_name: rapphim-web
    restart: unless-stopped
    # Next.js standalone: do that ~105 MiB. 512m du rong cho SSR luc dong nguoi.
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    ports:
      - "${WEB_PORT:-7100}:3000"
    environment:
      API_INTERNAL_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - rapphim

volumes:
  rapphim-data:

networks:
  rapphim:
    driver: bridge
    # Dat dai co dinh de gan duoc dia chi tinh cho bo phan giai. Cac dai 172.17 den
    # 172.23 tren may nay da co du an khac dung.
    ipam:
      config:
        - subnet: 172.29.0.0/16
